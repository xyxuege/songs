<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>廊桥遗梦 · 歌词页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06070f;
    --bg2:#0d0b1e;
    --ink:#f6ecec;
    --ink-dim:#cdbcc6;
    --ink-faint:#9a8aa3;
    --rose:#ff8fb3;
    --rose-deep:#ff5c8f;
    --rose-soft:#ffc2d4;
    --gold:#ffdf9e;
    --cyan:#8fd8ff;
    --line:rgba(255,143,179,.28);
    --card:rgba(16,12,30,.62);
    --card-border:rgba(255,160,190,.22);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Serif SC","Songti SC",serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{min-height:44px;min-width:44px}

  /* ---------- background layers ---------- */
  #stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;will-change:transform}
  .aurora i:nth-child(1){width:56vw;height:56vw;left:-14vw;top:-18vw;background:radial-gradient(circle,#3b1d5e 0%,transparent 65%);animation:drift1 26s ease-in-out infinite alternate}
  .aurora i:nth-child(2){width:48vw;height:48vw;right:-12vw;top:12vh;background:radial-gradient(circle,#5c2040 0%,transparent 65%);animation:drift2 32s ease-in-out infinite alternate}
  .aurora i:nth-child(3){width:40vw;height:40vw;left:22vw;bottom:-20vw;background:radial-gradient(circle,#122a4d 0%,transparent 62%);opacity:.45;animation:drift1 38s ease-in-out infinite alternate-reverse}
  @keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(6vw,4vh) scale(1.12)}}
  @keyframes drift2{from{transform:translate(0,0) scale(1.05)}to{transform:translate(-5vw,6vh) scale(.94)}}
  .moon{
    position:fixed;top:5.5vh;right:6vw;width:74px;height:74px;border-radius:50%;z-index:0;pointer-events:none;
    background:radial-gradient(circle at 38% 35%, #fff8e6, #f3dfae 55%, #d9b978);
    box-shadow:0 0 34px 10px rgba(255,230,160,.28),0 0 110px 40px rgba(255,220,150,.10);
    opacity:.9;
  }
  .moon::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 70% 62%, rgba(160,130,80,.20) 0 9px, transparent 10px),radial-gradient(circle at 30% 70%, rgba(160,130,80,.16) 0 6px, transparent 7px)}
  .grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;background-image:radial-gradient(rgba(255,255,255,.9) .5px, transparent .6px);background-size:3px 3px;mix-blend-mode:overlay}

  /* playback progress (top) */
  #progress{position:fixed;top:0;left:0;height:3px;width:0%;z-index:50;background:linear-gradient(90deg,var(--rose-deep),var(--gold));box-shadow:0 0 12px rgba(255,92,143,.8)}

  .wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:0 20px 30px}

  /* ---------- hero ---------- */
  .hero{padding:24px 0 0;text-align:center}
  .kicker{
    display:inline-flex;align-items:center;gap:12px;
    font-family:Georgia,serif;font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--rose);
  }
  .kicker::before,.kicker::after{content:"";width:38px;height:1px;background:linear-gradient(90deg,transparent,var(--rose));display:inline-block}
  .kicker::after{background:linear-gradient(90deg,var(--rose),transparent)}
  .thoughts{
    position:relative;
    width:90%;margin:14px auto 0;padding:13px 18px 14px;
    text-align:left;
    font-size:clamp(13px,2vw,14.5px);line-height:1.65;letter-spacing:.05em;color:#0e3a66;
    background:#ffffff;
    border:1px solid rgba(20,70,120,.5);border-radius:14px;
    box-shadow:0 14px 34px rgba(0,0,0,.35), inset 0 0 26px rgba(20,70,120,.06);
    backdrop-filter:blur(10px);
    white-space:pre-line;
  }
  .thoughts::before,.thoughts::after{
    content:"";position:absolute;width:20px;height:20px;pointer-events:none;
    border:0 solid #144a7a;opacity:.9;
  }
  .thoughts::before{top:-1px;left:-1px;border-top-width:2px;border-left-width:2px;border-top-left-radius:14px}
  .thoughts::after{bottom:-1px;right:-1px;border-bottom-width:2px;border-right-width:2px;border-bottom-right-radius:14px}
  .subtitle{
    margin:20px auto 0;max-width:640px;font-size:clamp(14px,2.6vw,17px);letter-spacing:.22em;color:#f0c3d2;line-height:1.9;
  }
  .subtitle b{color:var(--gold);font-weight:600}
  .credits{
    display:inline-block;margin-top:24px;padding:9px 28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    font-family:"Noto Sans SC",sans-serif;font-size:13px;letter-spacing:.32em;color:#f3d7e1;background:rgba(14,9,26,.45);
  }


  /* ---------- sunset bridge & river scene ---------- */
  .sky{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:linear-gradient(180deg,#221d47 0%,#46305f 24%,#7c4470 42%,#bd5a78 56%,#ea8663 68%,#f8ae66 76%,#fbc97e 84%,#f9d99a 100%);
  }
  .cloud{position:absolute;border-radius:50%;filter:blur(18px);pointer-events:none;will-change:transform}
  .cloud.c1{width:44vw;height:9vh;left:-6vw;top:9vh;background:radial-gradient(ellipse at center,rgba(255,170,150,.5),transparent 70%);animation:cloudDrift 52s ease-in-out infinite alternate}
  .cloud.c2{width:36vw;height:8vh;right:-4vw;top:20vh;background:radial-gradient(ellipse at center,rgba(255,140,160,.42),transparent 70%);animation:cloudDrift 64s ease-in-out infinite alternate-reverse}
  .cloud.c3{width:28vw;height:6vh;left:16vw;top:31vh;background:radial-gradient(ellipse at center,rgba(255,205,150,.4),transparent 70%);animation:cloudDrift 44s ease-in-out infinite alternate}
  @keyframes cloudDrift{from{transform:translateX(0)}to{transform:translateX(4.5vw)}}
  .sun{
    position:fixed;left:50%;bottom:calc(26vh - 36px);transform:translateX(-50%);
    width:96px;height:96px;border-radius:50%;z-index:0;pointer-events:none;
    background:radial-gradient(circle at 50% 42%,#fff6cf,#ffdc8f 52%,#ffae62 88%);
    box-shadow:0 0 44px 16px rgba(255,196,110,.5),0 0 130px 60px rgba(255,160,90,.22);
  }
  .bridge{position:fixed;left:50%;bottom:calc(26vh - 8px);transform:translateX(-50%);width:min(980px,98vw);z-index:0;pointer-events:none}
  .water{
    position:fixed;left:0;right:0;bottom:0;height:26vh;z-index:0;pointer-events:none;overflow:hidden;
    background:linear-gradient(180deg,#c97a63 0%,#7c5570 22%,#44557f 52%,#27365e 100%);
  }
  .water::before{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,rgba(255,220,170,.10) 0 2px,transparent 2px 9px,rgba(160,200,255,.05) 9px 10px,transparent 10px 17px);
    animation:shimmer 7s linear infinite;
  }
  @keyframes shimmer{from{background-position:0 0}to{background-position:0 34px}}
  .water::after{
    content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);
    width:150px;height:100%;
    background:linear-gradient(180deg,rgba(255,205,130,.4),rgba(255,180,110,.10) 55%,transparent 92%);
    filter:blur(7px);animation:sunpath 5.5s ease-in-out infinite alternate;
  }
  @keyframes sunpath{from{opacity:.65}to{opacity:1}}

  /* ---------- stage: vinyl + player ---------- */
  .stage{
    margin:24px auto 0;max-width:880px;
    background:var(--card);border:1px solid var(--card-border);border-radius:24px;
    padding:22px 30px 16px;backdrop-filter:blur(14px);
    box-shadow:0 30px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .stage-main{display:grid;grid-template-columns:222px 1fr;gap:28px;align-items:center}
  .vinyl-wrap{position:relative;width:208px;height:208px;margin:0 auto}
  .vinyl-glow{position:absolute;inset:-16px;border-radius:50%;background:radial-gradient(circle,rgba(255,92,143,.32),transparent 68%);animation:pulse 3.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
  .vinyl{
    position:absolute;inset:0;border-radius:50%;
    background:
      repeating-radial-gradient(circle at 50% 50%, #0a0a12 0 2px, #17171f 2px 4px);
    box-shadow:0 18px 44px rgba(0,0,0,.75), inset 0 0 0 1px rgba(255,255,255,.08), inset 0 0 60px rgba(0,0,0,.8);
    animation:spin 14s linear infinite;
  }
  body.is-playing .vinyl{animation-duration:3.6s}
  .vinyl::before{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 210deg, transparent 0deg, rgba(255,255,255,.14) 18deg, transparent 42deg, transparent 180deg, rgba(255,200,220,.10) 200deg, transparent 224deg);
  }
  .vinyl-label{
    position:absolute;top:50%;left:50%;width:78px;height:78px;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle at 38% 32%, #ff9ebb, #e14e7e 58%, #a92c52);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.22), 0 0 24px rgba(255,92,143,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;
  }
  .vinyl-label span{font-family:"Ma Shan Zheng",serif;font-size:12px;line-height:1.35;color:#fff;letter-spacing:.08em;text-shadow:0 1px 4px rgba(0,0,0,.4)}
  .vinyl-label small{font-family:"Noto Sans SC",sans-serif;font-size:8px;letter-spacing:.28em;color:rgba(255,255,255,.85);margin-top:4px}
  .vinyl-hole{position:absolute;top:50%;left:50%;width:14px;height:14px;transform:translate(-50%,-50%);border-radius:50%;background:#0b0b14;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tonearm{
    position:absolute;top:-6px;right:4px;width:86px;height:86px;transform-origin:69px 11px;transform:rotate(-24deg);
    transition:transform 1s cubic-bezier(.6,0,.2,1);z-index:3;pointer-events:none;
  }
  body.is-playing .tonearm{transform:rotate(6deg)}
  .tonearm svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}

  .player{min-width:0;text-align:left}
  .player h2{
    margin:0 0 4px;font-family:"Ma Shan Zheng","Noto Serif SC",serif;font-weight:400;
    font-size:clamp(29px,4.4vw,36px);line-height:1.15;letter-spacing:.12em;color:#fff;
    text-shadow:0 0 16px rgba(255,120,165,.45),0 0 44px rgba(255,92,143,.28),0 2px 12px rgba(0,0,0,.6);
  }
  .player h2 .accent{color:var(--rose-soft)}
  .player .by{font-family:"Noto Sans SC",sans-serif;font-size:13px;color:var(--ink-dim);letter-spacing:.14em}
  .controls{display:flex;align-items:center;gap:14px;margin-top:13px}
  .play-btn{
    width:50px;height:50px;flex:0 0 50px;border-radius:50%;border:1px solid rgba(255,170,200,.55);cursor:pointer;
    background:radial-gradient(circle at 32% 28%, #ff9ebb, #e14e7e 62%, #b02a54);color:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 28px rgba(225,78,126,.45), inset 0 1px 0 rgba(255,255,255,.4);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .play-btn:hover{transform:scale(1.06)}
  .play-btn:active{transform:scale(.97)}
  .play-btn svg{width:22px;height:22px;fill:#fff}
  .play-btn .icon-pause{display:none}
  body.is-playing .play-btn .icon-play{display:none}
  body.is-playing .play-btn .icon-pause{display:block}
  .track-meta{flex:1;min-width:0}
  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.13);overflow:hidden;cursor:pointer}
  .bar i{display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--rose-deep),var(--gold))}
  .times{display:flex;justify-content:space-between;margin-top:7px;font-family:"Noto Sans SC",sans-serif;font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
  .eq{display:flex;align-items:flex-end;gap:3px;height:15px;margin-top:9px}
  .eq i{width:4px;border-radius:2px;background:linear-gradient(180deg,var(--gold),var(--rose-deep));height:22%;opacity:.45}
  body.is-playing .eq i{opacity:1;animation:eq .9s ease-in-out infinite alternate}
  .eq i:nth-child(2n){animation-delay:.15s}.eq i:nth-child(3n){animation-delay:.3s}.eq i:nth-child(4n){animation-delay:.45s}.eq i:nth-child(5n){animation-delay:.6s}
  @keyframes eq{from{height:14%}to{height:100%}}
  audio{display:none}
  .status{font-family:"Noto Sans SC",sans-serif;font-size:12px;color:var(--gold);letter-spacing:.14em;min-height:17px;margin-top:5px}

  /* ---------- synced lyric stage (one line at a time) ---------- */
  .lyrics-in{
    margin-top:14px;padding:11px 8px 0;text-align:center;
    border-top:1px solid var(--line);
    min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  .sync-side{
    font-size:clamp(12px,2vw,14px);letter-spacing:.16em;color:var(--ink-faint);
    min-height:1.6em;line-height:1.6;opacity:.55;transition:opacity .5s ease;
    white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  }
  .sync-cur{
    position:relative;display:inline-block;max-width:100%;
    font-family:"Ma Shan Zheng","Noto Serif SC",serif;font-weight:400;
    font-size:clamp(19px,3.6vw,27px);line-height:1.3;letter-spacing:.07em;
    white-space:nowrap;
  }
  .sync-cur .lyr-base{color:rgba(246,236,236,.30);text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .sync-cur .lyr-fill{
    position:absolute;left:0;top:0;width:0%;overflow:hidden;white-space:nowrap;
    background:linear-gradient(92deg,var(--rose) 0%,var(--gold) 55%,var(--cyan) 105%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 14px rgba(255,120,165,.55)) drop-shadow(0 2px 8px rgba(0,0,0,.45));
  }
  .sync-cur.swap{animation:lyrIn .55s cubic-bezier(.2,.8,.3,1)}
  @keyframes lyrIn{0%{opacity:0;transform:translateY(16px) scale(.965);filter:blur(5px)}100%{opacity:1;transform:none;filter:none}}
  .sync-cur.idle .lyr-base{color:rgba(255,194,212,.65);animation:idlePulse 1.6s ease-in-out infinite}
  @keyframes idlePulse{0%,100%{opacity:.45}50%{opacity:1}}
  .sync-hint{font-family:"Noto Sans SC",sans-serif;font-size:10px;letter-spacing:.3em;color:var(--ink-faint)}

  /* floating notes */
  .notes{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .notes span{
    position:absolute;bottom:-40px;color:rgba(255,160,195,.5);font-size:20px;
    animation:rise linear infinite;text-shadow:0 0 12px rgba(255,120,165,.6);
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0) rotate(-8deg);opacity:0}
    12%{opacity:.85}
    88%{opacity:.6}
    100%{transform:translateY(-108vh) translateX(4vw) rotate(14deg);opacity:0}
  }

  /* ---------- footer ---------- */
  footer{text-align:center;padding:18px 0 34px;position:relative;z-index:2}
  .sign{
    display:inline-block;padding:11px 30px;border:1px solid rgba(255,154,184,.5);border-radius:99px;
    font-size:13px;letter-spacing:.42em;color:var(--rose-soft);background:rgba(18,10,28,.6);
    box-shadow:0 0 26px rgba(255,92,143,.22), inset 0 0 18px rgba(255,92,143,.08);
  }
  .foot-credit{margin-top:22px;font-family:"Noto Sans SC",sans-serif;font-size:12px;letter-spacing:.3em;color:var(--ink-faint)}

  @media (max-width:760px){
    .hero{padding-top:46px}
    .stage{padding:18px 16px 12px}
    .stage-main{grid-template-columns:1fr;gap:26px}
    .player{text-align:center}
    .player h2{font-size:27px}
    .controls{justify-content:center}
    .eq{justify-content:center}
    .moon{width:52px;height:52px;top:3vh;right:5vw}
    .vinyl-wrap{width:176px;height:176px}
    .vinyl-label{width:66px;height:66px}
    .vinyl-label span{font-size:13px}
    .tonearm{width:74px;height:74px}
    .lyrics-in{padding:9px 4px 0;min-height:64px}
    .sync-cur{white-space:normal}
    .sync-cur .lyr-fill{white-space:normal}
  }
  @media (prefers-reduced-motion: reduce){
    .vinyl,.aurora i,.notes span,.vinyl-glow{animation:none !important}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

<div class="sky" aria-hidden="true"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i></div>
<div class="sun" aria-hidden="true"></div>
<svg class="bridge" viewBox="0 0 1200 260" fill="none" aria-hidden="true">
  <path d="M0 208 Q 220 168 430 196 T 860 190 T 1200 200 V260 H0 Z" fill="#4a2c50" opacity=".45"/>
  <rect x="252" y="128" width="15" height="86" fill="#241729"/>
  <rect x="592" y="128" width="15" height="92" fill="#241729"/>
  <rect x="932" y="128" width="15" height="86" fill="#241729"/>
  <path d="M60 196 Q600 128 1140 196 L1140 216 Q600 152 60 216 Z" fill="#241729"/>
  <rect x="238" y="74" width="724" height="56" fill="#2a1a30"/>
  <path d="M218 76 L600 26 L982 76 L950 76 L600 34 L250 76 Z" fill="#1d1224"/>
  <g fill="#ffd98a" opacity=".9">
    <rect x="286" y="90" width="34" height="24" rx="2"/><rect x="352" y="90" width="34" height="24" rx="2"/>
    <rect x="418" y="90" width="34" height="24" rx="2"/><rect x="484" y="90" width="34" height="24" rx="2"/>
    <rect x="550" y="90" width="34" height="24" rx="2"/><rect x="616" y="90" width="34" height="24" rx="2"/>
    <rect x="682" y="90" width="34" height="24" rx="2"/><rect x="748" y="90" width="34" height="24" rx="2"/>
    <rect x="814" y="90" width="34" height="24" rx="2"/><rect x="880" y="90" width="34" height="24" rx="2"/>
  </g>
</svg>
<div class="water" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div id="progress" aria-hidden="true"></div>

<div class="wrap">

  <header class="hero">
	  <!---  <div class="kicker">✦ Midnight Neon &amp; Melancholy ✦</div   ---->
    <!-- 感想文字：把下面这段占位文字换成你自己的感想即可（可写多行） -->
    <p class="thoughts" id="thoughts">
		也送给一个男人 ：） 只要你有才有财高大帅，腹肌八块，那就值得上几段廊桥遗梦。你们说呢？不要像这首歌里，才只梦到了廊桥，就念念不忘。

		廊桥遗梦

		才高兼玉立，更挟万金全。
		合得廊桥约，何妨几度缘。
		莫随歌里客，才梦便缠绵。
		历尽人间路，归来仍少年。
	</p>
	  <!--- <p class="subtitle" id="subtitle">「 我把喜欢藏进每一道波纹 · <b>你依然是我最温柔的等候</b> 」</p>
    <div class="credits">演唱</div  ---->
  </header>

  <section class="stage" aria-label="播放器">
   <div class="stage-main">
    <div class="vinyl-wrap" aria-hidden="true">
      <div class="vinyl-glow"></div>
      <div class="vinyl">
        <div class="vinyl-label"><span>廊桥遗梦</span><small>SIDE A · 33⅓</small></div>
        <div class="vinyl-hole"></div>
      </div>
      <div class="tonearm">
        <svg viewBox="0 0 110 110" fill="none" aria-hidden="true">
          <circle cx="88" cy="14" r="11" fill="#2a2438" stroke="rgba(255,180,205,.6)" stroke-width="1.5"/>
          <circle cx="88" cy="14" r="4" fill="#ff8fb3"/>
          <line x1="88" y1="14" x2="26" y2="86" stroke="#cfc4d8" stroke-width="4" stroke-linecap="round"/>
          <rect x="14" y="82" width="18" height="12" rx="3" transform="rotate(50 23 88)" fill="#ff5c8f"/>
        </svg>
      </div>
    </div>

    <div class="player">
      <h2>廊桥<span class="accent">遗梦</span></h2>
      <div class="by">词曲：楚楚JOY 唱：星星</div>

      <div class="controls">
        <button class="play-btn" id="playBtn" type="button" aria-label="播放 / 暂停">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8v14.4c0 .9 1 1.5 1.8 1L20 13a1.15 1.15 0 0 0 0-2L8.8 3.9C8 3.4 7 4 7 4.8z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4h4v16h-4zM13.5 4h4v16h-4z"/></svg>
        </button>

</div>

<script>
(function(){
  "use strict";
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---- timed lyrics: [startSec, endSec, text] ---- */
  var LYRICS = [
    [27.84, 35.34, "廊桥边的风吹过衣袖"],
    [35.34, 42.60, "吹皱河面也吹乱心头"],
    [42.60, 49.12, "晚霞停在你眼睛里头"],
    [49.12, 57.34, "像一句话始终没开口"],
    [57.34, 64.12, "我看波浪一层一层走"],
    [64.86, 71.54, "带着月光流向下游"],
    [71.54, 78.12, "你站在桥的那一头"],
    [78.12, 86.60, "离我不远却想很久"],
    [86.60, 93.12, "如果河水能够听我说"],
    [93.70, 101.48, "它会不会轻轻告诉你呢"],
    [101.48, 108.48, "我把喜欢藏进每一道波纹"],
    [109.10, 116.66, "藏进黄昏落下的余温"],
    [116.66, 123.54, "藏进桥边摇晃的灯"],
    [123.54, 130.28, "和不敢靠近的眼神"],
    [130.28, 137.28, "我把思念交给缓缓的河流"],
    [138.10, 145.28, "它向前走，我在停留"],
    [145.80, 152.54, "直到月色漫过桥头"],
    [152.54, 160.78, "你依然是我最温柔的等候"],
    [188.86, 196.24, "桥下的水映着心动"],
    [196.24, 202.86, "像散落人间的温柔"],
    [202.86, 209.92, "我想陪你看四季深浅"],
    [209.92, 212.52, "看河岸开花"],
    [212.52, 217.72, "直到白头"],
    [217.72, 225.48, "我把喜欢藏进每一道波纹"],
    [225.48, 232.82, "藏进黄昏落下的余温"],
    [232.82, 239.86, "藏进桥边摇晃的灯"],
    [239.86, 246.86, "和不敢靠近的眼神"],
    [246.86, 253.86, "若有一天你回头看我"],
    [254.52, 261.22, "请记得那个黄昏时候"],
    [261.86, 268.76, "廊桥很长，河水很柔"],
    [268.76, 278.72, "而我的心事从未飘走"]
  ];
  var SONG_LEN = 287; /* seconds, used until real audio metadata loads */

  /* ---- player + lyric sync ---- */
  var btn = document.getElementById("playBtn");
  var status = document.getElementById("status");
  var audio = document.getElementById("track");
  var srcEl = document.getElementById("trackSrc");
  var tCur = document.getElementById("tCur");
  var tTot = document.getElementById("tTot");
  var bar = document.getElementById("bar");
  var barFill = document.getElementById("barFill");
  var prog = document.getElementById("progress");
  var lyrCur = document.getElementById("lyrCur");
  var lyrBase = document.getElementById("lyrBase");
  var lyrFill = document.getElementById("lyrFill");
  var lyrPrev = document.getElementById("lyrPrev");
  var lyrNext = document.getElementById("lyrNext");

  var hasSrc = !!(srcEl && (srcEl.getAttribute("src") || "").trim());
  var demoPlaying = false, demoSec = 0, demoStamp = null;
  var curIdx = -2; /* -2 = unset, -1 = gap/intro */

  function fmt(s){ s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }
  function nowSec(){
    if (hasSrc){ return audio.currentTime || 0; }
    if (demoPlaying && demoStamp !== null){
      return demoSec + (performance.now() - demoStamp) / 1000;
    }
    return demoSec;
  }
  function totalSec(){
    if (hasSrc && audio.duration && isFinite(audio.duration)) return audio.duration;
    return SONG_LEN;
  }
  function findLine(t){
    for (var i = 0; i < LYRICS.length; i++){
      if (t >= LYRICS[i][0] && t < LYRICS[i][1]) return i;
      if (t < LYRICS[i][0]) return -1;
    }
    return -1;
  }
  function setLine(idx, t){
    if (idx !== curIdx){
      curIdx = idx;
      var text, prev = "", next = "";
      if (idx >= 0){
        text = LYRICS[idx][2];
        prev = idx > 0 ? LYRICS[idx - 1][2] : "";
        next = idx < LYRICS.length - 1 ? LYRICS[idx + 1][2] : "";
        lyrCur.classList.remove("idle");
      } else {
        text = "";
        var upcoming = -1;
        for (var i = 0; i < LYRICS.length; i++){ if (t < LYRICS[i][0]){ upcoming = i; break; } }
        next = upcoming >= 0 ? LYRICS[upcoming][2] : "";
        prev = (upcoming > 0) ? LYRICS[upcoming - 1][2] : (LYRICS.length && t >= LYRICS[LYRICS.length-1][1] ? LYRICS[LYRICS.length-1][2] : "");
        lyrCur.classList.add("idle");
      }
      lyrBase.textContent = text;
      lyrFill.textContent = text;
      lyrPrev.textContent = prev;
      lyrNext.textContent = next;
      lyrCur.classList.remove("swap");
      void lyrCur.offsetWidth;
      lyrCur.classList.add("swap");
    }
    if (idx >= 0){
      var p = (t - LYRICS[idx][0]) / Math.max(0.1, LYRICS[idx][1] - LYRICS[idx][0]);
      lyrFill.style.width = Math.min(100, Math.max(0, p * 100)) + "%";
    } else {
      lyrFill.style.width = "0%";
    }
  }
  function tick(){
    var t = nowSec(), tot = totalSec();
    if (!hasSrc && demoPlaying && t >= tot){ demoSec = 0; demoStamp = performance.now(); t = 0; }
    tCur.textContent = fmt(t);
    tTot.textContent = fmt(tot);
    var pct = tot > 0 ? Math.min(100, (t / tot) * 100) : 0;
    barFill.style.width = pct + "%";
    prog.style.width = pct + "%";
    setLine(findLine(t), t);
  }
  setInterval(tick, 100);
  tick();

  function setPlayingUI(on){
    document.body.classList.toggle("is-playing", on);
    btn.setAttribute("aria-label", on ? "暂停" : "播放");
  }
  btn.addEventListener("click", function(){
    if (hasSrc){
      if (audio.paused){ audio.play(); } else { audio.pause(); }
      return;
    }
    if (demoPlaying){
      demoSec = nowSec(); demoPlaying = false; demoStamp = null;
      setPlayingUI(false);
      status.textContent = "已暂停 · 唱针抬起";
    } else {
      demoPlaying = true; demoStamp = performance.now();
      setPlayingUI(true);
      status.textContent = "唱针已落下 · 视觉演示中";
    }
    tick();
  });
  audio.addEventListener("play", function(){ setPlayingUI(true); status.textContent = "正在播放 · 廊桥遗梦"; });
  audio.addEventListener("pause", function(){ setPlayingUI(false); status.textContent = "已暂停 · 唱针抬起"; });
  audio.addEventListener("ended", function(){ setPlayingUI(false); status.textContent = "播放结束"; });
  audio.addEventListener("loadedmetadata", function(){ tick(); });

  bar.addEventListener("click", function(ev){
    var r = bar.getBoundingClientRect();
    var ratio = (ev.clientX - r.left) / Math.max(1, r.width);
    var target = ratio * totalSec();
    if (hasSrc){ audio.currentTime = target; }
    else { demoSec = target; if (demoPlaying) demoStamp = performance.now(); }
    curIdx = -2; tick();
  });
})();
</script>
